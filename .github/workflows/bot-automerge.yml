# Thin caller of the rmartz/bot-automerge-action composite Action. It enables
# GitHub-native auto-merge for trustworthy bot PRs — Dependabot patch/minor bumps
# and release PRs — gated on the required checks (including merge-safety), so
# nothing merges ahead of CI. The `@<sha>` pin is bumped by Dependabot.
#
# Migrated from the @rmartz/bot-automerge reusable workflow to its successor. A
# composite action can't declare its own triggers, hold write scopes, or use
# `secrets: inherit`, so this caller carries the trigger, grants the write
# permissions, owns `runs-on` + `steps`, and passes the token as an explicit input.
# The token is an installation token for the rmartz-merge-bot GitHub App, passed
# as the `token` input: a merge enabled with GITHUB_TOKEN fires no push
# workflows, so the release would never run. App-authored events still trigger
# push workflows, and the App has its own rate-limit pool, separate from the
# user's.
#
# The migration also drops the reusable workflow's per-PR `concurrency` group:
# GitHub permits only one PENDING run per group and cancels any it supersedes, so a
# burst of pull_request_target events (opening a PR and labelling it fires one
# each) left `cancelled` check-runs on the PR — a conclusion our automation reads
# as failing. Without a group nothing queues, so nothing is cancelled.

name: bot-automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  bot-automerge:
    # Skip the job outright on PRs the CLI could never trust, so a human PR shows a
    # free `skipped` instead of installing the CLI just to no-op. The two
    # conditions mirror the CLI's own detectBotPrType exactly — Dependabot by
    # author, release-please by head branch prefix — so nothing eligible is
    # skipped. The `autorelease: pending` label is not a signal: since
    # v2.0.0 the CLI ignores it, because anyone with triage permission can apply it
    # (rmartz/bot-automerge#41).
    # It is deliberately not an author test: release PRs may not come from a
    # predictable author, so the guard keys on the `release-please--` branch.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      || startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The App's Client ID and private key are stored as both Actions and
      # Dependabot secrets (a Dependabot-triggered run sees only the latter).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.MERGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_BOT_PRIVATE_KEY }}
      - uses: rmartz/bot-automerge-action@6b23093a6cfd17cad6582cd68b2037eea5eeb4a6 # v2.2.1
        with:
          pr: ${{ github.event.pull_request.number }}
          # Installation token for the rmartz-merge-bot GitHub App. An auto-merge
          # enabled with GITHUB_TOKEN fires no push workflows, so a bot merge would
          # reach main with no push-triggered CI, release, or merge-safety run
          # (rmartz/bot-automerge-action#31). App-authored events do trigger push
          # workflows, and the App has its own rate-limit pool, separate from the
          # user's.
          token: ${{ steps.app-token.outputs.token }}
