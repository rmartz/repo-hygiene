# Thin caller of the rmartz/bot-automerge-action composite Action (extracted from
# the ai-tools golden auto-merge, see rmartz/bot-automerge-action). It enables
# GitHub-native auto-merge for trustworthy bot PRs — Dependabot patch/minor bumps
# and release PRs — gated on the required checks (including merge-safety), so
# nothing merges ahead of CI. The `@<sha>` pin is bumped by Dependabot.
#
# Migrated from the @rmartz/bot-automerge reusable workflow to its successor. A
# composite action can't declare its own triggers, hold write scopes, or use
# `secrets: inherit`, so this caller carries the trigger, grants the write
# permissions, owns `runs-on` + `steps`, and passes any PAT as an explicit input.
# This repo releases via semantic-release, so `release-please-token` is unset and
# falls back to the job token; it is passed for parity with the consumer contract.
#
# The migration also drops the reusable workflow's per-PR `concurrency` group:
# GitHub permits only one PENDING run per group and cancels any it supersedes, so a
# burst of pull_request_target events (opening a PR and labelling it fires one
# each) left `cancelled` check-runs on the PR — a conclusion our automation reads
# as failing. Without a group nothing queues, so nothing is cancelled.

name: bot-automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  bot-automerge:
    # Skip the job outright on PRs the CLI could never trust, so a human PR shows a
    # free `skipped` instead of installing the CLI just to no-op. The three
    # conditions mirror the CLI's own detectBotPrType exactly — Dependabot by
    # author, release-please by branch prefix OR pending label — so nothing
    # eligible is skipped. It is deliberately not an author test: release-please
    # run under a PAT authors its release PR as that real user, not a [bot].
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      || startsWith(github.event.pull_request.head.ref, 'release-please--')
      || contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rmartz/bot-automerge-action@a46eafc1396993ffc04918f452b3d1c0e3c80f4f # v1.1.1
        with:
          pr: ${{ github.event.pull_request.number }}
          release-please-token: ${{ secrets.RELEASE_PLEASE_PAT }}
