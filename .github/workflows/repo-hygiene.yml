name: Repo Hygiene

# Dogfood: repo-hygiene is its own first consumer, using the exact caller shape
# every consuming repo uses. It pins our published reusable workflow by SHA
# (Dependabot bumps it via the github-actions ecosystem) and runs the default-on
# checks against our own tree through the published @rmartz/repo-hygiene —
# validating the consumer install + propagation path end to end.
#
# This is distinct from the CI "Self-hygiene" job, which runs the *full* check set
# from the freshly-built local CLI for regression coverage. This one validates the
# *shipped distribution*; that one validates the *code in the PR*.
#
# This file is self-managed by this repo — it is intentionally NOT the
# bootstrap-seeded (npm-install-@0.4.0) workflow. Bootstrap is a one-time new-repo
# starter, not an ongoing manager (see AGENTS.md § Repository conformance).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hygiene:
    permissions:
      contents: read
      packages: read
    uses: rmartz/repo-hygiene/.github/workflows/hygiene.yml@9bea45565355ea99e4669ca2b8db8c8badf21a1b # v1.0.0
