# Thin caller of the @rmartz/merge-safety reusable workflow (split out of
# @rmartz/pr-review — see rmartz/merge-safety). A reusable workflow can't declare
# its own triggers or hold write scopes, so this caller carries the triggers,
# grants the write permissions, threads the workflow_dispatch `pr` input, and
# passes `secrets: inherit`; the evaluate/invalidate logic, concurrency, and CLI
# install all live in the reusable workflow. The `@<sha>` pin is bumped by
# Dependabot (github-actions ecosystem).
#
# THE CHECK-RUN NAME `merge-safety` IS A FLEET CONTRACT — the auto-merge gate keys
# off a required status check of that exact name. It is posted by the reusable
# workflow's CLI; do not rename this workflow's check.

name: merge-safety

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate
        required: true

permissions:
  checks: write
  pull-requests: write
  contents: read
  actions: write
  packages: read

jobs:
  merge-safety:
    uses: rmartz/merge-safety/.github/workflows/merge-safety.yml@db145fb8c20164185eb9e1a1c237dc4d9085c69f # v0.1.0
    with:
      pr: ${{ inputs.pr }}
    secrets: inherit
