name: Release

# Automated releases via semantic-release. On every push to main it analyses the
# conventional commits since the last release, and — when there is a releasable
# change — publishes @rmartz/repo-hygiene to GitHub Packages (public), creates the
# GitHub Release with generated notes, tags `v<version>`, and commits the
# version-synced .github/workflows/hygiene.yml + package.json back to main so the
# tag installs the matching CLI version. See .releaserc.json.

on:
  push:
    branches: [main]

# Serialize releases so two pushes can't publish concurrently.
concurrency: release

permissions:
  contents: write # create tags/releases (the branch commit uses RELEASE_TOKEN below)
  packages: write # publish to GitHub Packages
  issues: write # semantic-release comments on released issues
  pull-requests: write # semantic-release comments on released PRs

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false # semantic-release authenticates via GITHUB_TOKEN below
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm exec semantic-release
        env:
          # RELEASE_TOKEN is an owner PAT (contents:write); the version-sync commit
          # is pushed to protected main under it (the default GITHUB_TOKEN can't
          # bypass the require-PR rule). semantic-release also uses it for the
          # GitHub API. NPM_TOKEN publishes to GitHub Packages with the default
          # token (packages:write).
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
