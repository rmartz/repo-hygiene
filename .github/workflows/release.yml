name: Release

# Automated CLI releases via semantic-release. On every push to main it analyses
# the conventional commits since the last release and, when there is a releasable
# change, publishes @rmartz/repo-hygiene to GitHub Packages (public), creates the
# GitHub Release with generated notes, and tags v<version>. It does NOT commit
# anything back to main — no version-sync, no PAT — so the default GITHUB_TOKEN
# suffices even on protected main (tags/releases aren't branch pushes). See
# .releaserc.json. The reusable workflow that installs this CLI lives in the
# separate rmartz/repo-hygiene-action repo (see #45).

on:
  push:
    branches: [main]

# Serialize releases so two pushes can't publish concurrently.
concurrency: release

permissions:
  contents: write # create tags and GitHub releases
  packages: write # publish to GitHub Packages
  issues: write # semantic-release comments on released issues
  pull-requests: write # semantic-release comments on released PRs

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false # semantic-release authenticates via GITHUB_TOKEN below
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # @semantic-release/npm authenticates to the publishConfig registry
          # (GitHub Packages) with this token; GITHUB_TOKEN has packages:write.
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
