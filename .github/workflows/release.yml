name: Release

# Automated CLI releases via semantic-release, run by the fleet's shared workflow
# (rmartz/semantic-release-ci), whose toolchain (semantic-release, its plugins and
# the changelog preset) is tested there before a bump reaches this pin; the
# options stay here in .releaserc.json. On every push to main it analyses
# the conventional commits since the last release and, when there is a releasable
# change, publishes @rmartz/repo-hygiene to npmjs (public), creates the GitHub
# Release with generated notes, and tags v<version>. It does NOT commit anything
# back to main — no version-sync, no PAT — so the default GITHUB_TOKEN suffices
# even on protected main (tags/releases aren't branch pushes). See
# .releaserc.json. The GitHub Action that installs this CLI for consumers lives
# in the separate rmartz/repo-hygiene-action repo (see #45).
#
# npm auth is OIDC trusted publishing: npmjs trusts THIS workflow file
# (`release.yml`) in rmartz/repo-hygiene, so there is no NPM_TOKEN secret.
# Renaming this file breaks publishing until the trusted publisher on npmjs is
# updated to match. Provenance attestations are generated automatically.
#
# OIDC publishing needs npm >= 11.5.1, so both jobs run on Node 24 (npm 11).
# @semantic-release/npm bundles npm 11 but runs `npm` with preferLocal, and pnpm
# does not link that bundled copy into node_modules/.bin — so the publish uses
# the runner's npm. On Node 22 (npm 10) it fails with ENEEDAUTH after the tag and
# GitHub Release were already created, which is how v7.1.0 was tagged unpublished.
# The shared release workflow defaults to Node 24 and, because this workflow
# grants `id-token: write`, fails before tagging if npm is older.
#
# `workflow_dispatch` with a `tag` backfills such a tag: it builds that tag's
# tree and publishes it under the tag's version. It is part of this file (not a
# separate workflow) because the npm trusted publisher only trusts `release.yml`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish to npm (backfill a failed publish)
        required: true
      dist-tag:
        description: npm dist-tag to publish under
        required: false
        default: latest

# Serialize releases so two pushes can't publish concurrently.
concurrency: release

permissions:
  contents: write # create tags and GitHub releases
  id-token: write # npm trusted publishing (OIDC) + provenance
  issues: write # semantic-release comments on released issues
  pull-requests: write # semantic-release comments on released PRs

jobs:
  # The shared workflow declares no permissions of its own; it runs with the
  # workflow-level ones above. It also serializes releases per repository.
  release:
    if: github.event_name == 'push'
    uses: rmartz/semantic-release-ci/.github/workflows/semantic-release.yml@dbcbcd8e0425ae4c0aa294d6595566ac4643a83d # v1.1.0
    with:
      # Build dist/ before @semantic-release/npm packs it; the shared workflow
      # installs this repo's dependencies (pnpm, frozen lockfile) first.
      build-command: pnpm build

  backfill:
    name: Publish existing tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    env:
      TAG: ${{ inputs.tag }}
      DIST_TAG: ${{ inputs.dist-tag }}
    steps:
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be vX.Y.Z, got '$TAG'"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      # Not ./.github/actions/setup: that is the tag's copy, which may predate its
      # node-version input.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish
        run: |
          name="$(node -p 'require("./package.json").name')"
          if [[ -n "$(npm view "$name@$VERSION" version --registry=https://registry.npmjs.org/ 2>/dev/null)" ]]; then
            echo "::notice::$name@$VERSION is already on npm; nothing to do."
            exit 0
          fi
          npm --version
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public --tag "$DIST_TAG"
