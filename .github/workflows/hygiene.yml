name: Repo Hygiene (reusable)

# The single entry point consuming repos pin. A consumer adds a tiny caller:
#
#   jobs:
#     hygiene:
#       permissions: { contents: read, packages: read }
#       uses: rmartz/repo-hygiene/.github/workflows/hygiene.yml@<sha>  # vX.Y.Z
#
# Dependabot's github-actions ecosystem bumps that <sha> pin via PRs, so updates
# — including newly-added checks — propagate with no per-repo YAML edits.
#
# MIGRATION (#45): this reusable workflow is moving to the standalone
# `rmartz/repo-hygiene-action` repo, which keeps its installed CLI version current
# via Dependabot. This copy is no longer version-synced by the release pipeline —
# the `default` below is FROZEN at the last release-please-synced value pending the
# cutover; consumers migrate to `rmartz/repo-hygiene-action` there.

on:
  workflow_call:
    inputs:
      checks:
        description: >-
          Space-separated check names to run. Empty (the default) runs the
          package's registry-derived default-on set (the universally-safe
          checks), so a newly-added default-on check auto-joins on the next
          Dependabot bump with no edit here; pass e.g. "okf docs-links" to opt
          into repo-specific checks.
        type: string
        required: false
        default: ''
      version:
        description: '@rmartz/repo-hygiene version to install (pinned to this release).'
        type: string
        required: false
        default: 3.0.0 # frozen pending migration to rmartz/repo-hygiene-action (#45)
      node-version:
        description: Node.js version to run the checks under.
        type: string
        required: false
        default: '22'
      config:
        description: Path to the .repo-hygiene.yml config (optional).
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: '@rmartz'
      - name: Install ai-repo-hygiene
        env:
          # The public @rmartz/repo-hygiene package on GitHub Packages is readable
          # with the built-in GITHUB_TOKEN — no consumer PAT required.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install -g "@rmartz/repo-hygiene@${{ inputs.version }}"
      - name: Run checks
        run: ai-repo-hygiene ${{ inputs.checks }} --check ${{ inputs.config && format('--config {0}', inputs.config) || '' }}
