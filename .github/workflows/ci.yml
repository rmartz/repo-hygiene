name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Per-ref concurrency: a new push to a branch cancels its in-flight run, but
# main is never cancelled (each push to the default branch runs to completion).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run test

  hygiene:
    name: Self-hygiene (local build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Dogfood the checks against our own tree using the freshly-built CLI (not
      # the published package), so a regression in a check fails our own CI. This
      # runs a broader set than a consumer's default-on set — every check that
      # applies to this repo, configured via .repo-hygiene.yml — for maximum
      # regression coverage. docs/ is an OKF bundle (see docs/okf-format.md), so
      # okf / okf-index run here too.
      - run: pnpm run build
      - run: >-
          node dist/bin/repo-hygiene.js
          conflict-markers action-pins package-pins docs-links md-pairing okf okf-index file-caps
          --check --config .repo-hygiene.yml

  release-dry-run:
    name: Release dry-run
    # Validate the semantic-release config — above all that the changelog
    # toolchain (preset + conventional-changelog-writer) still renders — on PRs,
    # so a broken release config is caught here rather than on the post-merge
    # Release run (which only fires on push to main; see release.yml). A broken
    # toolchain is exactly what slipped through when the release migration merged.
    #
    # A plain `semantic-release --dry-run` early-exits on a non-main branch
    # before rendering notes, which would pass a broken config. We override
    # --branches with the PR head ref (which exists on the remote, so
    # semantic-release accepts it as a release branch) to force the
    # analyzeCommits + generateNotes path; --dry-run guarantees nothing is
    # published, tagged, or commented. Restricted to same-repo PRs because a
    # fork's head branch does not exist on this remote.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false # authenticates via GITHUB_TOKEN below
      - uses: ./.github/actions/setup
      # Skip @semantic-release/npm's registry-auth check for the dry-run only.
      # Real publishing moves to npm trusted publishing (OIDC), where the npm
      # token exchange only works from release.yml, so a PR run has no npm
      # credential to verify. With `npmPublish: false` the plugin skips the auth
      # check; the notes-rendering path this job guards is unchanged. This edits
      # the job's working copy only — the committed .releaserc.json is untouched.
      - name: Disable npm publishing for the dry-run
        run: |
          jq '.plugins |= map(
            if . == "@semantic-release/npm" then [., {npmPublish: false}]
            elif type == "array" and .[0] == "@semantic-release/npm"
            then [.[0], ((.[1] // {}) + {npmPublish: false})]
            else . end)' .releaserc.json > "$RUNNER_TEMP/releaserc.json"
          mv "$RUNNER_TEMP/releaserc.json" .releaserc.json
      - run: pnpm exec semantic-release --dry-run --branches "$HEAD_REF"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
