name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Per-ref concurrency: a new push to a branch cancels its in-flight run, but
# main is never cancelled (each push to the default branch runs to completion).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run test

  hygiene:
    name: Self-hygiene (local build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Dogfood the checks against our own tree using the freshly-built CLI (not
      # the published package), so a regression in a check fails our own CI. This
      # runs a broader set than a consumer's default-on set — every check that
      # applies to this repo, configured via .repo-hygiene.yml — for maximum
      # regression coverage. docs/ is an OKF bundle (see docs/okf-format.md), so
      # okf / okf-index run here too.
      - run: pnpm run build
      - run: >-
          node dist/bin/repo-hygiene.js
          conflict-markers action-pins package-pins docs-links md-pairing okf okf-index file-caps
          --check --config .repo-hygiene.yml
