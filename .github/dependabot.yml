version: 2
# Cooldown: since 2026-07-14 Dependabot waits 3 days after a release before
# proposing it, even with no `cooldown` configured. Third-party dependencies keep
# that default (security updates are never delayed by it). Only first-party
# releases (`rmartz/*` actions and reusable workflows) are exempt: they're
# published from our own repos with provenance, so the wait adds no supply-chain
# protection and only holds fixes back from the fleet.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # Explicit, so declaring the block can't change the third-party default.
      default-days: 3
      exclude:
        - 'rmartz/*'
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Minor and patch action bumps land in one PR; every major opens its own PR,
      # so a major held for human review can't hold routine bumps back from
      # auto-merge.
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Split by dependency type: production bumps ship to users, so they land as
      # `fix` and cut a patch release; dev-dependency bumps never reach the shipped
      # artifact, so they stay release-less `chore`.
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Prettier isolated into its own group so a reformatting bump can't hide in a
      # catch-all (a Prettier minor can reformat the whole tree).
      prettier:
        patterns:
          - 'prettier'
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - 'prettier'
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
  # The actionlint release the `actionlint` check downloads. Dependabot can't read
  # the pin in src/checks/actionlint-release.ts, so it watches this sensor
  # Dockerfile instead (nothing builds it). A bump goes red until the pin is
  # regenerated with `node scripts/update-actionlint.mjs <version>`. It ships a new
  # linter to consumers, so it lands as `fix` and cuts a patch release.
  - package-ecosystem: docker
    directory: /tools/actionlint
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
